x-app-env: &app-env
  APP_ENV: docker
  HTTP_ADDR: ":8080"
  DATABASE_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
  DB_AUTO_MIGRATE: "true"
  OIDC_ISSUER: http://localhost:8081/realms/wager
  OIDC_JWKS_URL: http://keycloak:8080/realms/wager/protocol/openid-connect/certs
  OIDC_AUDIENCE: wager-api
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_ENDPOINT: http://localstack:4566
  SQS_WAGER_QUEUE: wager-transactions.fifo
  SQS_WAGER_DLQ: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE: wallet-events.fifo
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak/wager-realm.json:/opt/keycloak/data/import/wager-realm.json:ro
    ports:
      - "8081:8080"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events.fifo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  app1: &app
    build: .
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      localstack: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/wager", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    ports:
      - "8082:8080"

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3
    ports:
      - "8083:8080"

  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    working_dir: /loadtest
    volumes:
      - ./loadtest:/loadtest
    environment:
      BASE_URLS: http://app1:8080,http://app2:8080,http://app3:8080
      KEYCLOAK_URL: http://keycloak:8080
      STEADY_RPS: ${STEADY_RPS:-150}
      DURATION: ${DURATION:-60s}
      WALLETS: ${WALLETS:-200}
      HOT_WALLETS: ${HOT_WALLETS:-3}
      HOT_VUS: ${HOT_VUS:-30}
      HOT_RPS: ${HOT_RPS:-40}
    command: ["run", "wager.js"]
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
